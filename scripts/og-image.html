<!DOCTYPE html>
<!-- Source for static/images/og-image.png. Regenerate from the repo root with:
  google-chrome --headless --hide-scrollbars --window-size=1200,630 \
    --screenshot=static/images/og-image.png scripts/og-image.html -->
<html>
  <head>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,600" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding-bottom: 110px;
        color: #fff;
        font-family: "Source Sans Pro", sans-serif;
        background: linear-gradient(rgba(19, 21, 25, 0.55), rgba(19, 21, 25, 0.55)),
          url("../static/images/background.png") bottom / cover no-repeat #000;
      }
      img {
        width: 120px;
        height: 120px;
      }
      .rule {
        width: 1px;
        height: 40px;
        background: #fff;
      }
      .content {
        border-top: 1px solid #fff;
        border-bottom: 1px solid #fff;
        padding: 36px 64px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-weight: 600;
        font-size: 84px;
        letter-spacing: 18px;
        text-transform: uppercase;
      }
      p {
        margin: 12px 0 0;
        font-weight: 300;
        font-size: 26px;
        letter-spacing: 6px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <img src="../static/images/logo@32x.png" alt="" />
    <div class="rule"></div>
    <div class="content">
      <h1>DungeonDJ</h1>
      <p>Voice-controlled sound for your tabletop games</p>
    </div>
  </body>
</html>
